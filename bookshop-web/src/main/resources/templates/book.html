            <form th:object="${book}" th:action="@{/book/}" method="post">

                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                    <p>Please Correct Errors Below</p>

                &lt;!&ndash;this is a Generic form for create and update so when we have not Id it's a create type and when

                <input type="hidden" th:field="*{id}"/>

                    <div class="panel panel-primary">
                        <div class="panel-heading">

                                <div class="col-md-3 form-group"

                                ? 'col-md-3 form-group hasErrors' : 'col-md-3 form-group'">
                                    <label>Book Name:</label>
                                    &lt;!&ndash;showing errors in Bullet style&ndash;&gt;
                                    <input type="text" class="form-control" th:field="*{name}"
                                           th:errorclass="has-error"/>
                                    <span class="help-block"
                                          th:if="${#fields.hasErrors('name')}">
                                        <ul>
                                            <li th:each="err :
${#fields.errors('name')}" th:text="${err}"/>
                                        </ul>

                                    </span>
                                </div>
                            </div>

                                </div>

                                    <div class="radio">
                                        <label>
                                            <input type="checkbox" value=""/>
                                            Cat 1
                                        </label>
                                    </div>
                                    <div class="radio" th:remove="all">
                                        <label>
                                            <input type="checkbox" value=""/>
                                            Cat 2
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="panel-body">

                                            <li th:each="author : ${author.getFirstName}"
                                                th:text="${(author.getFirstName() +

                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>

                            <div class="row">

                                <div class="col-md-3 form-group" th:class="${#fields.hasErrors('name')}

                                    <label>FORMAT:</label>
                                    <input type="text" class="form-control" th:field="*{name}"
                                           th:errorclass="has-error"/>
                                    <span class="help-block" th:if="${#fields.hasErrors('name')}">
                                        <ul>
                                            <li th:each="err : ${#fields.errors('name')}" th:text="${err}"/>
                                        </ul>
                                    </span>
                                </div>

                                <div class="col-md-3 form-group" th:class="${#fields.hasErrors('available')}
                                ? 'col-md-3 form-group has-error' : 'col-md-3 form-group'">
                                    <label>AVAILABLE:</label>
                                    <input type="text" class="form-control" th:field="*{available}"
                                           th:errorclass="has-error"/>
                                    <span class="help-block" th:if="${#fields.hasErrors('available')}">
                                        <ul>
                                            <li th:each="err : ${#fields.errors('available')}" th:text="${err}"/>
                                        </ul>
                                    </span>
                                </div>

                                <div class="col-md-3 form-group" th:class="${#fields.hasErrors('available')}
                                ? 'col-md-3 form-group has-error' : 'col-md-3 form-group'">
                                    <label>AVAILABLE:</label>
                                    <input type="text" class="form-control" th:field="*{available}"
                                           th:errorclass="has-error"/>
                                    <span class="help-block" th:if="${#fields.hasErrors('available')}">
                                        <ul>
                                            <li th:each="err : ${#fields.errors('available')}" th:text="${err}"/>
                                        </ul>
                                    </span>
                                </div>

                            </div>
                            <div class="row">

                                <div class="col-md-3 form-group" th:class="${#fields.hasErrors('publisher')}

                                    <label>PUBLISHER:</label>
                                    <input type="text" class="form-control" th:field="*{publisher}"

                                        <ul>
                                            <li th:each="err : ${#fields.errors('publisher')}" th:text="${err}"/>
                                        </ul>
                                    </span>
                                </div>

                                <div class="col-md-3 form-group">
                                    <label>PUBLISH DATE:</label>
                                    <input type="text" class="form-control" th:field="*{publishDate}"/>
                                </div>

                                <div class="col-md-3 form-group" th:class="${#fields.hasErrors('publishDate')}
                                ? 'col-md-3 form-group has-error' : 'col-md-3 form-group'">
                                    <label>PUBLISH DATE:</label>
                                    <input type="text" class="form-control" th:field="*{publishDate}"
                                           th:errorclass="has-error"/>
                                    <span class="help-block" th:if="${#fields.hasErrors('publishDate')}">
                                        <ul>
                                            <li th:each="err : ${#fields.errors('publishDate')}" th:text="${err}"/>
                                        </ul>
                                    </span>
                                </div>

                            </div>

                    </div>
                    <div class="panel panel-primary">
                        <div class="panel-heading">
                            <div class="row">
                                <div class="col-md-11 ">
                                    <h1 class="panel-title">DESCRIPTION</h1>
                                </div>

                                    <a class="btn btn-default" href="#"

                    <div class="panel panel-primary">

                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
