<!--this is an input form for getting all properties of a Recipe for creating a new Recipe or updating a Recipe that
 already exist -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--head part is for using Bootstrap CDN and special CSS that we used in other forms too, indeed it make our form
 style like others,the Body part is different-->
<head>
    <meta charset="UTF-8"/>
    <title>Book Form</title>

    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous"
          th:href="@{/webjars/bootstrap/3.3.7-1/css/bootstrap.min.css}">

    <script src="/webjars/jquery/1.11.1/jquery.min.js"></script>

    <!-- Latest compiled and minified JavaScript -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"
            integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
            crossorigin="anonymous" th:src="@{/webjars/bootstrap/3.3.7-1/js/bootstrap.min.js}"></script>
</head>
<body>
<!--/*@thymesVar id="Book" type="nas.bookshop.domain.Book"*/-->
<div class="container-fluid" style="margin-top: 20px">
    <div class="row">
        <div class="col-md-6 col-md-offset-3">
            <!--here we send an empty RecipeCommand object in HTML file to client side,
             and th:action Specifies where to send the form-data when the form is submitted
             I guess this invokes post controller method of recipe:saveOrUpdate.
             and the method is post because client side sends the recipe properties -data- to server side-->
            <!--  <form th:object="${recipe}" th:action="@{/recipe/}" method="post"> -->
            <!-- after adding update part, changing method part only-->
            <!--th:action="@{/book/}"-->
            <form th:object="${book}" method="post">
                <!--   <form th:object="${owner}" class="form-horizontal" id="add-owner-form" method="post">-->
                <!--if we have any rejected error in BindingResult, then show a red box in bottom of the page,
                class belongs to Bootstrap!-->
              <!--  <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                    <p>Please Correct Errors Below</p>
                </div>-->
                <!--this is a Generic form for create and update so when we have not Id it's a create type and when
                 we have Id is an update-->
                <input type="hidden" th:field="*{id}"/>
                <div class="pannel-group">
                    <div class="panel panel-primary">
                        <div class="panel-heading">
                            <div class="row">
                                <div class="col-md-9 form-group">
                                    <h1 class="panel-title">Book Information</h1>
                                </div>
                                <div class="col-md-3 form-group">
                                    <a class="btn btn-default" th:href="@{'/book/'+ ${book.id}+ '/image'}">Edit Image Of
                                        The Book</a>
                                </div>
                            </div>
                        </div>
                        <div class="panel-body">
                            <div class="row">
                                <!--"form-group": needed for optimum spacing-->
                                <div class="col-md-9 form-group"
                                     th:class="${#fields.hasErrors('name')}
                                ? 'col-md-3 form-group hasErrors' : 'col-md-3 form-group'">
                                    <label>Book Name:</label>
                                    <!--showing errors in Bullet style-->
                                    <input type="text" class="form-control" th:field="*{name}"
                                           th:errorclass="has-error"/>
                                    <span class="help-block"
                                          th:if="${#fields.hasErrors('name')}">
                                        <ul>
                                            <li th:each="err :
${#fields.errors('name')}" th:text="${err}"/>
                                        </ul>

                                    </span>
                                </div>


                                <!--<div class="row">-->


                                <!-- <input type="text" class="form-control" th:field="*{name}">-->
                                <!--     <input type="text" class="form-control" th:field="*{publisher}">-->
                                <!--      <form:select-->
                                <div class="col-md-3 form-group">
                                    <label>Publisher:</label>

                                    <select class="form-control" name="publisher.id" th:field="*{publisherId}">
                                        <option th:each="publisherEach : ${publishers}"
                                                th:value="${publisherEach.id}" th:text="${publisherEach.name}">Each
                                        </option>
                                        <!-- th:selected="${publisherEach.id.equals(book.publisher.id)}"-->

                                    </select>
                                </div>

                            </div>

                            <div class="row">
                                <!--stands for a group:here for categories  -->
                                <div class="col-md-3 form-group">
                                    <label>BISAC Categories:</label>
                                </div>
                                <div class="col-md-9 form-group">
                                    <div class="radio">
                                        <label>
                                            <input type="checkbox" value=""/>
                                            Cat 1
                                        </label>
                                    </div>
                                    <div class="radio" th:remove="all">
                                        <label>
                                            <input type="checkbox" value=""/>
                                            Cat 2
                                        </label>
                                    </div>
                                </div>

                                <div class="col-md-3 form-group">
                                    <label>Formats:</label>
                                    <select class="form-control" name="format.id">
                                        <option th:each="formatEach : ${formats}"
                                                th:value="${formatEach.id}" th:text="${formatEach.name}"
                                                th:field="*{formats}">Each
                                        </option>

                                        <!-- th:selected="${formatEach.id.equals(book.format.id)}"-->

                                    </select>
                                </div>


                                <div class="col-md-3 form-group">
                                    <label>Categories:</label>

                                </div>

                            </div>
                            <!--here was the list-->
                            <div class="row">
                                <!--I guess it prepare a 3 part division for us: 3 box for 3 properties-->
                                <!--first part-->
                                <!-- Format Part should edit, here name field should replaced with format properties and
                                shows format many to many relation, it has related issue number #13
                                <div class="col-md-3 form-group" th:class="${#fields.hasErrors('name')}
                                ? 'col-md-3 form-group has-error' : 'col-md-3 form-group'">
                                    <label>FORMAT:</label>
                                    <input type="text" class="form-control" th:field="*{name}"
                                           th:errorclass="has-error"/>
                                    <span class="help-block" th:if="${#fields.hasErrors('name')}">
                                        <ul>
                                            <li th:each="err : ${#fields.errors('name')}" th:text="${err}"/>
                                        </ul>
                                    </span>
                                </div> -->
                                <!--second part-->
                                <div class="col-md-3 form-group" th:class="${#fields.hasErrors('available')}
                                ? 'col-md-3 form-group has-error' : 'col-md-3 form-group'">
                                    <div class="radio">
                                        <label>
                                            <input type="checkbox" value="*{available}"/>
                                            Available
                                        </label>
                                    </div>

                                </div>

                                <div class="col-md-3 form-group" th:class="${#fields.hasErrors('price')}
                                ? 'col-md-3 form-group has-error' : 'col-md-3 form-group'">
                                    <label>Price:</label>
                                    <input type="text" class="form-control" th:field="*{price}"
                                           th:errorclass="has-error"/>
                                    <span class="help-block" th:if="${#fields.hasErrors('price')}">
                                        <ul>
                                            <li th:each="err : ${#fields.errors('price')}" th:text="${err}"/>
                                        </ul>
                                    </span>
                                </div>

                                <div class="col-md-3 form-group" th:class="${#fields.hasErrors('pages')}
                                ? 'col-md-3 form-group has-error' : 'col-md-3 form-group'">
                                    <label>Pages:</label>
                                    <input type="text" class="form-control" th:field="*{pages}"
                                           th:errorclass="has-error"/>
                                    <span class="help-block" th:if="${#fields.hasErrors('pages')}">
                                        <ul>
                                            <li th:each="err : ${#fields.errors('pages')}" th:text="${err}"/>
                                        </ul>
                                    </span>
                                </div>

                            </div>
                            <div class="row">


                                <div class="col-md-3 form-group">
                                    <label>PUBLISH DATE:</label>
                                    <input type="date" class="form-control" th:field="*{publishDate}"/>
                                </div>

                                <div class="col-md-3 form-group" th:class="${#fields.hasErrors('language')}
                                ? 'col-md-3 form-group has-error' : 'col-md-3 form-group'">
                                    <label>Language:</label>
                                    <input type="text" class="form-control" th:field="*{language}"
                                           th:errorclass="has-error"/>
                                    <span class="help-block" th:if="${#fields.hasErrors('language')}">
                                        <ul>
                                            <li th:each="err : ${#fields.errors('language')}" th:text="${err}"/>
                                        </ul>
                                    </span>
                                </div>

                            </div>
                        </div>
                    </div>
                    <div class="panel panel-primary">

                        <!--maybe I use this part for Author/cat/format or other missed parts
                        <div class="panel-heading">
                            <div class="row">
                                <div class="col-md-11 ">
                                    <h1 class="panel-title"></h1>
                                </div>
                                <div class="col-md-1">
                                    <a class="btn btn-default" href="#"
                                       th:href="@{'/book/' + ${book.id} + '/description'}" role="button">View</a>

                                </div>
                            </div>
                        </div> -->

                    </div>
                    <div class="panel panel-primary">
                        <div class="panel-heading">
                            <h1 class="panel-title">DESCRIPTION</h1>
                        </div>
                        <div class="panel-body">
                            <div class="row">
                                <div class="col-md-12 form-group">
                                    <textarea class="form-control" rows="3" th:field="*{description}"></textarea></div>
                            </div>
                        </div>
                    </div>
                    <div class="panel panel-primary">
                        <div class="panel-heading">
                            <h1 class="panel-title">REVIEW</h1>
                        </div>
                        <div class="panel-body">
                            <div class="row">
                                <div class="col-md-12 form-group">
                                    <textarea class="form-control" rows="3" th:field="*{review}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!--old path for having submit button, but because of having 2 different posts for
                    new book, I changed it in this way.-->
                    <!--  <button type="submit" class="btn btn-primary">Submit</button>-->

                    <div class="form-group">
                        <!-- <div class="col-sm-offset-2 col-sm-10">-->
                        <button
                                class="btn btn-primary" type="submit" th:text="Save">Add
                            Owner
                        </button>
                        <!-- </div>-->
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
