# This is necessary to let DB to creat and populate data in it while initializing spring
spring.jpa.defer-datasource-initialization=true
#This is just a defining a specified name for DB, to avoid having a different name of DB in every spring loading
spring.datasource.url=jdbc:h2:mem:bookdb
#added to show the debug logs I wrote in method bodies
logging.level.nas.bookshop=debug

